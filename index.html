<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: Arial, sans-serif;
            background: #f5f7fa;
            color: #1f2937;
        }

        main {
            padding: 3rem;
            text-align: center;
        }

        h1 {
            margin: 0 0 0.75rem;
            font-size: clamp(2.5rem, 8vw, 5rem);
        }

        p {
            margin: 0;
            color: #64748b;
            font-size: 1.125rem;
        }
    </style>
</head>
<body>
    <main>
        <h1>Welcome</h1>
        <p>Glad you're here.</p>
    </main>
</body>
</html>
